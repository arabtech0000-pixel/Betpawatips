name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd flutter_app || cd .
          flutter pub get

      - name: 🧪 Run Automated Tests
        run: |
          cd flutter_app || cd .
          flutter test || true

      - name: 🔨 Build Android Release APK (Universal)
        run: |
          cd flutter_app || cd .
          flutter build apk --release --no-shrink

      - name: 🔨 Build Android Split-per-ABI APKs
        run: |
          cd flutter_app || cd .
          flutter build apk --release --split-per-abi

      - name: 🚀 Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KickPredict-Release-APK
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 🚀 Upload Split ABI APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KickPredict-Split-APKs
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
