name: kickpredict_flutter
description: "KickPredict & Aviator Predictor - Football Tips, Match Analytics & Smart Aviator Predictor for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Charts & Data Visualization (Overflow Charts, Momentum Flow, Aviator Multipliers)
  fl_chart: ^0.70.2

  # Networking & Caching
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Firebase Suite (Authentication & Realtime Database)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4

  # Local Persistence
  shared_preferences: ^2.3.2

  # UI, Icons & Typography
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
